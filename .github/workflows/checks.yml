name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  security:
    name: Privacy and permission tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Starts a temporary local database with all migrations applied.
      # No keys or passwords needed; nothing touches the real projects.
      - run: supabase db start
      - name: Run tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/security_test.sql
